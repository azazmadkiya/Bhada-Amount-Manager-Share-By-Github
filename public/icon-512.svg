<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="truckGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#truckGrad512)"/>
  
  <g filter="url(#shadow)">
    <!-- Truck Container -->
    <path d="M100 190 h180 v160 h-180 z" fill="#ffffff" rx="8"/>
    <!-- Cab -->
    <path d="M280 230 h80 l45 50 v70 h-125 z" fill="#dbeafe" rx="6"/>
    <!-- Cab Window -->
    <path d="M292 245 h65 l30 35 h-95 z" fill="#1e3a8a"/>
    <!-- Front Bumper & Headlight -->
    <rect x="390" y="325" width="20" height="18" rx="4" fill="#fbbf24" />
    
    <!-- Rupees / Bhada Badge on container -->
    <circle cx="190" cy="270" r="48" fill="#f59e0b" />
    <text x="190" y="290" font-size="62" font-family="Arial, sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
    
    <!-- Lines on container -->
    <line x1="140" y1="210" x2="140" y2="330" stroke="#cbd5e1" stroke-width="4" />
    <line x1="240" y1="210" x2="240" y2="330" stroke="#cbd5e1" stroke-width="4" />

    <!-- Wheels -->
    <circle cx="160" cy="360" r="36" fill="#0f172a"/>
    <circle cx="160" cy="360" r="16" fill="#94a3b8"/>
    <circle cx="350" cy="360" r="36" fill="#0f172a"/>
    <circle cx="350" cy="360" r="16" fill="#94a3b8"/>
  </g>
</svg>
